<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var savedTheme = localStorage.getItem('sdmd-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.dataset.theme = savedTheme;
        }
        var savedHc = localStorage.getItem('sdmd-hc');
        if (savedHc === 'on' || savedHc === 'off') {
          document.documentElement.dataset.hc = savedHc;
        }
        var savedScale = localStorage.getItem('sdmd-text-scale');
        if (savedScale === '1' || savedScale === '1.25' || savedScale === '1.5') {
          document.documentElement.dataset.textScale = savedScale;
        }
        var savedMotion = localStorage.getItem('sdmd-motion');
        if (savedMotion === 'on' || savedMotion === 'off') {
          document.documentElement.dataset.motion = savedMotion;
        }
        if (localStorage.getItem('sdmd-lang') === 'en') {
          document.documentElement.lang = 'en-US';
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" />
    <title>SDMD S/A – Proposta de Arquitetura</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
